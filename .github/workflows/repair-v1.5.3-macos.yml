name: Repair v1.5.3 macOS SDK Asset

on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/repair-v1.5.3-macos.yml

permissions:
  contents: write

jobs:
  repair-macos-sdk:
    runs-on: macos-latest
    steps:
      - name: Checkout v1.5.3
        uses: actions/checkout@v4
        with:
          ref: v1.5.3

      - name: Configure
        run: cmake --preset release-macos

      - name: Build
        run: cmake --build --preset release-macos

      - name: Test
        run: ctest --preset release-macos

      - name: Install
        run: cmake --install build/release-macos --config Release --prefix stage/loxdb-sdk-v1.5.3-macos-arm64

      - name: Package archive
        working-directory: stage
        run: tar -czf loxdb-sdk-v1.5.3-macos-arm64.tar.gz loxdb-sdk-v1.5.3-macos-arm64

      - name: Generate checksum
        working-directory: stage
        run: shasum -a 256 loxdb-sdk-v1.5.3-macos-arm64.tar.gz > loxdb-sdk-v1.5.3-macos-arm64.tar.gz.sha256

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "Missing required secret: GPG_PRIVATE_KEY" >&2
            exit 1
          fi
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Sign checksum
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: stage
        run: |
          if [ -z "${GPG_KEY_ID}" ] || [ -z "${GPG_PASSPHRASE}" ]; then
            echo "Missing required secrets: GPG_KEY_ID and/or GPG_PASSPHRASE" >&2
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --local-user "${GPG_KEY_ID}" \
            --armor --detach-sign \
            --output loxdb-sdk-v1.5.3-macos-arm64.tar.gz.sha256.asc \
            loxdb-sdk-v1.5.3-macos-arm64.tar.gz.sha256

      - name: Upload repaired assets
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: stage
        run: |
          gh release upload v1.5.3 \
            loxdb-sdk-v1.5.3-macos-arm64.tar.gz \
            loxdb-sdk-v1.5.3-macos-arm64.tar.gz.sha256 \
            loxdb-sdk-v1.5.3-macos-arm64.tar.gz.sha256.asc \
            --clobber
