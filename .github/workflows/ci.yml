name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  boundary-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boundary Rules Check
        shell: pwsh
        run: ./tools/check_boundary_rules.ps1

  spdx-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX Header Check
        shell: pwsh
        run: ./tools/check_spdx_headers.ps1

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-debug-linux
          - os: windows-latest
            preset: ci-debug-windows
          - os: macos-latest
            preset: ci-debug-macos
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Verifier integration smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake --build --preset ${{ matrix.preset }} --target lox_verify
          ctest --preset ${{ matrix.preset }} -R test_offline_verifier -V

  compiler-matrix-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            build_type: Release
          - compiler: clang
            cxx: clang++
            build_type: Debug
          - compiler: clang
            cxx: clang++
            build_type: Release
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and Ninja
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure
        run: >
          cmake -S . -B build/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
      - name: Test
        run: >
          ctest --test-dir build/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          --output-on-failure

  sanitize-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure (ASan/UBSan)
        run: cmake --preset ci-asan-ubsan-linux
      - name: Build (ASan/UBSan)
        run: cmake --build --preset ci-asan-ubsan-linux
      - name: Test (ASan/UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ci-asan-ubsan-linux --output-on-failure --stop-on-failure -V

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run static analysis
        run: bash scripts/run_static_analysis.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: build/static-analysis/

  static-analysis-style:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run style analysis (non-blocking)
        run: bash scripts/run_static_analysis_style.sh
      - name: Upload style report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-style-report
          path: build/static-analysis-style/

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Run core clang-tidy
        run: |
          clang-tidy \
            src/loxdb.c src/lox_kv.c src/lox_ts.c src/lox_rel.c src/lox_wal.c src/lox_crc.c \
            port/ram/lox_port_ram.c port/posix/lox_port_posix.c \
            --quiet -- -std=c99 -Iinclude -Isrc -Iport/ram -Iport/posix

  coverage-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Configure (coverage)
        run: cmake --preset ci-coverage-linux
      - name: Build (coverage)
        run: cmake --build --preset ci-coverage-linux
      - name: Test (coverage)
        run: ctest --preset ci-coverage-linux
      - name: Capture coverage (lcov)
        run: |
          lcov --capture --directory build/ci-coverage-linux --output-file coverage.raw.info
          lcov --extract coverage.raw.info \
            '*/src/loxdb.c' '*/src/lox_kv.c' '*/src/lox_ts.c' \
            '*/src/lox_rel.c' '*/src/lox_wal.c' '*/src/lox_crc.c' \
            '*/port/ram/lox_port_ram.c' '*/port/posix/lox_port_posix.c' \
            --ignore-errors unused --output-file coverage.info
          lcov --summary coverage.info --fail-under-lines 83
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.info

  arduino-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arduino Library Manager lint
        uses: arduino/arduino-lint-action@v3
        with:
          compliance: permissive
          library-manager: submit
          project-type: library
          recursive: false
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Compile Arduino ESP32-S3 example
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 --libraries .. examples/BasicKV

  platformio-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PlatformIO Core
        run: pipx install platformio
      - name: Validate and pack PlatformIO library
        run: pio pkg pack
      - name: Compile PlatformIO ESP32-S3 consumer
        env:
          LOXDB_SOURCE_DIR: ${{ github.workspace }}
        run: |
          consumer_dir="${RUNNER_TEMP}/loxdb-platformio-consumer"
          mkdir -p "${consumer_dir}/src"
          cp tests/consumer/platformio_arduino/platformio.ini "${consumer_dir}/"
          cp tests/consumer/platformio_arduino/src/main.cpp "${consumer_dir}/src/"
          cd "${consumer_dir}"
          pio run
